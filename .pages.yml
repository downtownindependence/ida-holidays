media:
  input: public/uploads
  output: /uploads

content:
  - name: holiday_settings
    label: Holiday Page Settings
    type: file
    path: src/data/holiday-settings.json
    description: Everything on the holiday page except the events themselves.
    fields:
      - name: contestStage
        label: Window contest stage
        type: select
        required: true
        default: coming-soon
        description: Controls what the contest section shows. Nothing changes on its own, so switch this on Nov 28 (Voting open), when voting ends (Voting closed), and when results are in (Winners).
        options:
          values:
            - { value: coming-soon, label: 'Coming soon (business sign-up)' }
            - { value: voting-open, label: 'Voting open' }
            - { value: voting-closed, label: 'Voting closed' }
            - { value: winners, label: 'Winners' }

      - name: businessSignupUrl
        label: Business sign-up form link
        type: string
        required: false
        pattern:
          regex: '^$|^https?://.+'
          message: 'Leave blank, or paste a full web address starting with https://'
        description: The Google Form businesses use to enter the contest. Shown as a button while the stage is Coming soon.

      - name: signupDeadline
        label: Business sign-up deadline
        type: date
        required: false
        options:
          format: 'yyyy-MM-dd'

      - name: votingOpens
        label: Voting opens
        type: date
        required: false
        options:
          format: 'yyyy-MM-dd'
        description: Shown as "Voting opens Saturday, November 28" while the stage is Coming soon.

      - name: votingDeadline
        label: Last day to vote
        type: date
        required: false
        options:
          format: 'yyyy-MM-dd'
        description: Shown on the page while voting is open.

      - name: winnersAnnounced
        label: Winners announced the week of
        type: date
        required: false
        options:
          format: 'yyyy-MM-dd'
        description: Shown as "Winners will be announced the week of December 28" once voting is closed.

      - name: votingFormUrl
        label: Voting form link (pre-filled)
        type: string
        required: false
        pattern:
          regex: '^$|^https?://.+'
          message: 'Leave blank, or paste a full web address starting with https://'
        description: 'Powers the ballot on the page. In the voting Google Form, open the ⋮ menu, choose "Get pre-filled link", and type these exact answers: voter@example.com for the email question, WINDOW1, WINDOW2 and WINDOW3 for the three window questions, NEWSLETTER for the newsletter question. Click "Get link", copy it, and paste it here. If the link is wrong, the page falls back to buttons that open the Google Form.'

      - name: participatingBusinesses
        label: Participating businesses
        type: object
        list:
          collapsible:
            summary: '{fields.name}'
        description: Businesses with a decorated window. During voting each one becomes a card on the ballot. The name you type here is exactly what gets recorded in the votes sheet.
        fields:
          - name: name
            label: Business name
            type: string
            required: true
            description: Spelled the way you want it to appear in the votes sheet. Avoid renaming a business once voting has started, or its votes will be split between two spellings.
          - name: address
            label: Address
            type: string
            required: false
            description: Optional. For example "180 S Main St".
          - name: link
            label: Website or Facebook page
            type: string
            required: false
            pattern:
              regex: '^$|^https?://.+'
              message: 'Leave blank, or paste a full web address starting with https://'
          - name: photo
            label: Photo of the window
            type: image
            required: false
            description: Optional. A wide photo works best.

      - name: santaPhotoSpots
        label: Santa photo spots
        type: object
        list:
          collapsible:
            summary: '{fields.business}'
        description: Leave this empty and the Santa section stays off the page.
        fields:
          - name: business
            label: Business name
            type: string
            required: true
          - name: schedule
            label: Dates and times
            type: string
            required: true
            description: For example "Saturdays, Dec 5 and Dec 12, 11 AM to 2 PM".
          - name: link
            label: Website or Facebook page
            type: string
            required: false
            pattern:
              regex: '^$|^https?://.+'
              message: 'Leave blank, or paste a full web address starting with https://'
          - name: note
            label: Note
            type: text
            required: false
            description: Optional. For example "free photos, bring your own camera".

      - name: winners
        label: Contest winners
        type: object
        list:
          collapsible:
            summary: '{fields.business}'
        description: Only shown once the contest stage is set to Winners. Add up to three.
        fields:
          - name: place
            label: Place
            type: select
            required: true
            options:
              values:
                - { value: '1', label: '1st place ($150)' }
                - { value: '2', label: '2nd place ($75)' }
                - { value: '3', label: '3rd place ($50)' }
          - name: business
            label: Winning business
            type: string
            required: true
          - name: photo
            label: Photo of the window
            type: image
            required: false

      - name: volunteerCallout
        label: Volunteer callout
        type: object
        description: An optional box near the bottom of the page, for things like the wreath lighting volunteer party.
        fields:
          - name: show
            label: Show on the website
            type: boolean
            default: false
            description: Turn this off to hide the callout without deleting what you wrote.
          - name: headline
            label: Headline
            type: string
            required: false
          - name: date
            label: Date
            type: string
            required: false
            description: Free text, for example "Thursday, Dec 4 at 6 PM".
          - name: text
            label: Short text
            type: text
            required: false
          - name: link
            label: Sign up link
            type: string
            required: false
            pattern:
              regex: '^$|^https?://.+'
              message: 'Leave blank, or paste a full web address starting with https://'

  - name: events
    label: Events
    type: collection
    path: src/content/events
    filename: '{fields.name}.md'
    view:
      fields: [name, start, location, category, visible]
      primary: name
      sort: [start, name]
    fields:
      - name: name
        label: Event name
        type: string
        required: true
        description: Shown as the event title, for example "Santa Train". A lowercase "and" in the name, like "Cocoa Station and Photo Booth", is set in script on its own line, like the flyer.
      - name: start
        label: Starts
        type: date
        required: true
        options:
          format: "yyyy-MM-dd'T'HH:mm"
          time: true
        description: Date and start time of the event. Events on the same day are grouped under one date circle.
      - name: end
        label: Ends
        type: date
        required: true
        options:
          format: "yyyy-MM-dd'T'HH:mm"
          time: true
        description: Date and end time. The event drops off the site once this passes. Needed even when "Custom time text" is used, though it won't show then.
      - name: timeText
        label: Custom time text
        type: string
        required: false
        description: Optional. Replaces the start and end times on the page, for times like "9AM or 12PM". Leave blank to show the start and end times.
      - name: location
        label: Location
        type: string
        required: true
        description: Where it happens, for example "Riverfront Park".
      - name: cost
        label: Cost
        type: string
        required: false
        description: Optional. Shown after the location, for example "FREE" or "$10".
      - name: highlight
        label: Highlight
        type: string
        required: false
        description: Optional. A short perk shown in slanted type, for example "Free Santa hats".
      - name: category
        label: Category
        type: select
        required: true
        default: IDA
        options:
          values:
            - { value: IDA, label: 'IDA event' }
            - { value: City, label: 'City of Independence event' }
            - { value: Outside, label: 'Outside organizer' }
        description: Who is putting the event on. Not shown on the site.
      - name: crowd
        label: Expected crowd
        type: select
        required: true
        default: medium
        options:
          values:
            - { value: small, label: 'Small' }
            - { value: medium, label: 'Medium' }
            - { value: large, label: 'Large' }
        description: Rough size, so downtown businesses can plan staffing. Not shown on the site.
      - name: icon
        label: Little drawing
        type: select
        required: false
        options:
          values:
            - { value: cocoa, label: 'Hot cocoa mug' }
            - { value: santa, label: 'Santa hat' }
            - { value: train, label: 'Train' }
            - { value: gift, label: 'Gift' }
            - { value: letter, label: 'Letter' }
            - { value: camera, label: 'Camera' }
            - { value: breakfast, label: 'Pancakes' }
            - { value: wreath, label: 'Wreath' }
            - { value: tree, label: 'Tree' }
        description: Optional. A small gold drawing shown above the event name.
      - name: description
        label: Short description
        type: text
        required: false
        description: Optional. Only add one if it says more than the event name already does.
      - name: link
        label: More info link
        type: string
        required: false
        pattern:
          regex: '^https?://.+'
          message: 'Enter a full web address starting with https://'
        description: Optional. A ticket page, registration form, or Facebook event. Shows a button.
      - name: buttonText
        label: Button text
        type: string
        required: false
        description: Optional. With a link, this labels the button (for example "Get tickets"; the default is "More details"). With no link, it shows as a placeholder that can't be clicked yet, for example "Tickets coming soon".
      - name: businessTips
        label: Tips for businesses
        type: text
        required: false
        description: Optional. Internal guidance, for example "stay open until 8 pm". Not shown on the site.
      - name: visible
        label: Show on the website
        type: boolean
        default: true
        description: Turn this off to hide the event without deleting it.
      - name: body
        label: Extra details
        type: rich-text
        required: false
        description: Optional. Longer notes. Not shown on the site yet.
